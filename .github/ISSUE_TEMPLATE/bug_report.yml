name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste clipboard contents, passwords, keys or other private data.**
        Describe the problem instead, or use dummy values.

        To report a security vulnerability, do not use this form. Follow
        [SECURITY.md](https://github.com/TheAlsaadi/ClipBench/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Copy some text
        2. Press the hotkey
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ClipBench version
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2, x64
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log excerpt (optional)
      description: Logs contain event types, sizes and formats, never clip content. Check the excerpt before you post it.
      render: text
